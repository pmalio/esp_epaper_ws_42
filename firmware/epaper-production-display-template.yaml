# Produkcyjny szablon firmware — Waveshare 4.2" V2 + ESP32-WROOM-32
# Wymaga unikalnych kluczy per egzemplarz w secrets.yaml.
# Mapowanie encji jest konfigurowane na etapie przygotowania urządzenia.

substitutions:
  # Zmieniaj nazwę urządzenia dla każdego egzemplarza.
  device_name: "ekran-domowy-01"
  device_friendly_name: "Ekran e-Paper"
  project_version: "1.0.1"
  # Generuj unikalne SSID i hasło dla KAŻDEGO egzemplarza.
  # Hasło ma celowo znaki alfanumeryczne, aby poprawnie działało w Wi-Fi QR.
  provisioning_ap_ssid: "ekran-domowy-01-Konfiguracja"
  provisioning_ap_password: "CHANGE-THIS-PER-DEVICE"
  # Każdą encję przypisz do odpowiedniej encji klienta przed kompilacją.
  entity_sensor_temp_parter_temperature: "sensor.replace_me_sensor_temp_parter_temperature"  # ustaw na encję klienta: sensor.temp_parter_temperature
  entity_sensor_temp_parter_humidity: "sensor.replace_me_sensor_temp_parter_humidity"  # ustaw na encję klienta: sensor.temp_parter_humidity
  entity_sensor_temp_outdoor_temperature: "sensor.replace_me_sensor_temp_outdoor_temperature"  # ustaw na encję klienta: sensor.temp_outdoor_temperature
  entity_sensor_temp_outdoor_humidity: "sensor.replace_me_sensor_temp_outdoor_humidity"  # ustaw na encję klienta: sensor.temp_outdoor_humidity
  entity_sensor_actual_power: "sensor.replace_me_sensor_actual_power"  # ustaw na encję klienta: sensor.actual_power
  entity_sensor_power_consumption: "sensor.replace_me_sensor_power_consumption"  # ustaw na encję klienta: sensor.power_consumption
  entity_sensor_all_standby_power: "sensor.replace_me_sensor_all_standby_power"  # ustaw na encję klienta: sensor.all_standby_power
  entity_sensor_power_desk_office_power: "sensor.replace_me_sensor_power_desk_office_power"  # ustaw na encję klienta: sensor.power_desk_office_power
  entity_sensor_temp_office_temperature: "sensor.replace_me_sensor_temp_office_temperature"  # ustaw na encję klienta: sensor.temp_office_temperature
  entity_sensor_temp_office_humidity: "sensor.replace_me_sensor_temp_office_humidity"  # ustaw na encję klienta: sensor.temp_office_humidity
  entity_sensor_temp_basement_temperature: "sensor.replace_me_sensor_temp_basement_temperature"  # ustaw na encję klienta: sensor.temp_basement_temperature
  entity_sensor_temp_basement_humidity: "sensor.replace_me_sensor_temp_basement_humidity"  # ustaw na encję klienta: sensor.temp_basement_humidity
  entity_sensor_air_quality_pm25: "sensor.replace_me_sensor_air_quality_pm25"  # ustaw na encję klienta: sensor.air_quality_pm25
  entity_sensor_air_quality_voc_index: "sensor.replace_me_sensor_air_quality_voc_index"  # ustaw na encję klienta: sensor.air_quality_voc_index
  entity_sensor_air_quality_temperature: "sensor.replace_me_sensor_air_quality_temperature"  # ustaw na encję klienta: sensor.air_quality_temperature
  entity_sensor_air_quality_humidity: "sensor.replace_me_sensor_air_quality_humidity"  # ustaw na encję klienta: sensor.air_quality_humidity
  entity_sensor_temp_1p_temperature: "sensor.replace_me_sensor_temp_1p_temperature"  # ustaw na encję klienta: sensor.temp_1p_temperature
  entity_sensor_temp_1p_humidity: "sensor.replace_me_sensor_temp_1p_humidity"  # ustaw na encję klienta: sensor.temp_1p_humidity
  entity_binary_sensor_smoke_sensor_1st_floor_smoke: "binary_sensor.replace_me_binary_sensor_smoke_sensor_1st_floor_smoke"  # ustaw na encję klienta: binary_sensor.smoke_sensor_1st_floor_smoke
  entity_binary_sensor_smoke_sensor_attic_smoke: "binary_sensor.replace_me_binary_sensor_smoke_sensor_attic_smoke"  # ustaw na encję klienta: binary_sensor.smoke_sensor_attic_smoke
  entity_binary_sensor_smoke_sensor_kitchen_smoke: "binary_sensor.replace_me_binary_sensor_smoke_sensor_kitchen_smoke"  # ustaw na encję klienta: binary_sensor.smoke_sensor_kitchen_smoke
  entity_binary_sensor_smoke_sensor_living_room_smoke: "binary_sensor.replace_me_binary_sensor_smoke_sensor_living_room_smoke"  # ustaw na encję klienta: binary_sensor.smoke_sensor_living_room_smoke
  entity_binary_sensor_water_sensor_basement_water_leak: "binary_sensor.replace_me_binary_sensor_water_sensor_basement_water_leak"  # ustaw na encję klienta: binary_sensor.water_sensor_basement_water_leak
  entity_binary_sensor_water_sensor_bathroom_water_leak: "binary_sensor.replace_me_binary_sensor_water_sensor_bathroom_water_leak"  # ustaw na encję klienta: binary_sensor.water_sensor_bathroom_water_leak
  entity_binary_sensor_water_sensor_bathroom_small_water_leak: "binary_sensor.replace_me_binary_sensor_water_sensor_bathroom_small_water_leak"  # ustaw na encję klienta: binary_sensor.water_sensor_bathroom_small_water_leak
  entity_binary_sensor_water_sensor_kitchen_water_leak: "binary_sensor.replace_me_binary_sensor_water_sensor_kitchen_water_leak"  # ustaw na encję klienta: binary_sensor.water_sensor_kitchen_water_leak
  entity_binary_sensor_water_sensor_storage_water_leak: "binary_sensor.replace_me_binary_sensor_water_sensor_storage_water_leak"  # ustaw na encję klienta: binary_sensor.water_sensor_storage_water_leak
  entity_binary_sensor_gate_garage_door_contact: "binary_sensor.replace_me_binary_sensor_gate_garage_door_contact"  # ustaw na encję klienta: binary_sensor.gate_garage_door_contact
  entity_binary_sensor_rear_door_contact: "binary_sensor.replace_me_binary_sensor_rear_door_contact"  # ustaw na encję klienta: binary_sensor.rear_door_contact
  entity_binary_sensor_garden_cam_online: "binary_sensor.replace_me_binary_sensor_garden_cam_online"  # ustaw na encję klienta: binary_sensor.garden_cam_online
  entity_binary_sensor_street_cam_online: "binary_sensor.replace_me_binary_sensor_street_cam_online"  # ustaw na encję klienta: binary_sensor.street_cam_online
  entity_person_pawel: "person.replace_me_person_pawel"  # ustaw na encję klienta: person.pawel
  entity_person_agnieszka: "person.replace_me_person_agnieszka"  # ustaw na encję klienta: person.agnieszka
  entity_person_ida: "person.replace_me_person_ida"  # ustaw na encję klienta: person.ida
  entity_person_anna: "person.replace_me_person_anna"  # ustaw na encję klienta: person.anna

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  min_version: 2026.9.1
  project:
    name: ekran_epaper.home_display
    version: ${project_version}
  includes:
    - factory_reset.h

esp32:
  board: esp32dev
  partitions: ../hardware/epaper_partitions.csv
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 30min

ota:
  - platform: esphome
    encryption:

wifi:
  # QR na ekranie koduje dokładnie te dane punktu konfiguracyjnego.
  # Wygeneruj unikalne ssid i hasło dla każdego egzemplarza.
  ap:
    ssid: "${provisioning_ap_ssid}"
    password: "${provisioning_ap_password}"
    ap_timeout: 10s
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          id(current_page) = 0;
      - component.update: epaperdisplay
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;
      - component.update: epaperdisplay

captive_portal:
improv_serial:

qr_code:
  - id: setup_qr
    value: "WIFI:T:WPA;S:${provisioning_ap_ssid};P:${provisioning_ap_password};;"
    ecc: MEDIUM

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reset_confirmation_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reset_previous_page
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 120s
    then:
      - if:
          condition:
            lambda: 'return id(wifi_connected) && !id(reset_confirmation_pending);'
          then:
            - lambda: |-
                id(current_page) = (id(current_page) + 1) % 6;
            - component.update: epaperdisplay

script:
  - id: reset_confirmation_timeout
    mode: restart
    then:
      # Start the five-second window after the prompt has been drawn.
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(reset_confirmation_pending);'
          then:
            - lambda: |-
                id(reset_confirmation_pending) = false;
                id(current_page) = id(reset_previous_page);
            - component.update: epaperdisplay
            - logger.log:
                level: INFO
                format: "Factory reset confirmation timed out; reset cancelled"

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~°ĄĆĘŁŃÓŚŹŻąćęłńóśźż'

  - file: "gfonts://Roboto"
    id: font_large
    size: 30
    glyphs: ' 0123456789.-°C%W'

  - file: "gfonts://Roboto@700"
    id: font_small_bold
    size: 18
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~°ĄĆĘŁŃÓŚŹŻąćęłńóśźż'

  - file: "gfonts://Roboto@700"
    id: font_large_bold
    size: 30
    glyphs: ' 0123456789.-°C%W'

sensor:
  - platform: homeassistant
    entity_id: ${entity_sensor_temp_parter_temperature}
    id: indoor_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_parter_humidity}
