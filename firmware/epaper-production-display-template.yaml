    id: gate_contact

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_rear_door_contact}
    id: rear_door

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_garden_cam_online}
    id: garden_camera

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_street_cam_online}
    id: street_camera


text_sensor:
  - platform: homeassistant
    entity_id: ${entity_person_pawel}
    id: person_pawel

  - platform: homeassistant
    entity_id: ${entity_person_agnieszka}
    id: person_agnieszka

  - platform: homeassistant
    entity_id: ${entity_person_ida}
    id: person_ida

  - platform: homeassistant
    entity_id: ${entity_person_anna}
    id: person_anna


        
image:
  - platform: file
    file: "/config/esphome/images/totoro_100x100_.bmp"
    id: totoro_bmp_100x100
    type: BINARY

display:
  - platform: waveshare_epaper
    id: epaperdisplay
    model: gdey042t81
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4
    reset_duration: 2ms
    rotation: 180
    full_update_every: 1
    update_interval: never

    lambda: |-
      // Strona konfiguracji — zachowana bez zmian funkcjonalnych.
      if (!id(wifi_connected)) {
        it.fill(Color::WHITE);
        it.print(200, 8, id(font_small_bold), TextAlign::TOP_CENTER,
                 "PIERWSZA KONFIGURACJA");
        it.line(10, 36, 390, 36, Color::BLACK);
        it.qr_code(18, 65, id(setup_qr), Color::BLACK, 4);
        it.print(220, 70, id(font_small_bold), TextAlign::TOP_LEFT,
                 "1. Zeskanuj QR");
        it.print(220, 100, id(font_small_bold), TextAlign::TOP_LEFT,
                 "2. Polacz z Wi-Fi");
        it.print(220, 130, id(font_small_bold), TextAlign::TOP_LEFT,
                 "ekranu");
        it.print(220, 172, id(font_small_bold), TextAlign::TOP_LEFT,
                 "3. Otworz:");
        it.print(220, 198, id(font_small_bold), TextAlign::TOP_LEFT,
                 "192.168.4.1");
        it.print(220, 240, id(font_small), TextAlign::TOP_LEFT,
                 "Wybierz domowe Wi-Fi");

      } else if (id(reset_confirmation_pending)) {
        // Ekran potwierdzenia resetu — zachowuje dotychczasowy przepływ.
        it.fill(Color::BLACK);
        it.print(200, 20, id(font_small_bold), TextAlign::TOP_CENTER,
                 "RESET FABRYCZNY?");
        it.line(20, 58, 380, 58, Color::WHITE);
        it.print(200, 82, id(font_small_bold), TextAlign::TOP_CENTER,
                 "NACISNIJ RESET PONOWNIE");
        it.print(200, 112, id(font_small_bold), TextAlign::TOP_CENTER,
                 "W CIAGU 5 SEKUND");
        it.line(20, 150, 380, 150, Color::WHITE);
        it.print(200, 172, id(font_small_bold), TextAlign::TOP_CENTER,
                 "BRAK POTWIERDZENIA = ANULUJ");
        it.print(200, 216, id(font_small_bold), TextAlign::TOP_CENTER,
                 "GPIO26: POTWIERDZ");
        it.print(200, 246, id(font_small_bold), TextAlign::TOP_CENTER,
                 "GPIO27: NIEAKTYWNY");

      } else if (id(current_page) == 0) {
        // STRONA 1: podstawowy dashboard — temperatura, wilgotność, moc.
        it.fill(Color::BLACK);
        it.print(200, 8, id(font_small_bold), TextAlign::TOP_CENTER, "DOM");
        it.line(10, 36, 390, 36, Color::WHITE);
        it.line(200, 42, 200, 145, Color::WHITE);

        it.print(100, 48, id(font_small_bold), TextAlign::TOP_CENTER, "WEWNATRZ");
        if (id(indoor_temp).has_state())
          it.printf(100, 76, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.1f C", id(indoor_temp).state);
        else
          it.print(100, 76, id(font_large_bold), TextAlign::TOP_CENTER, "--.- C");
        if (id(indoor_humidity).has_state())
          it.printf(100, 116, id(font_small_bold), TextAlign::TOP_CENTER,
                    "Wilgotnosc %.0f%%", id(indoor_humidity).state);
        else
          it.print(100, 116, id(font_small_bold), TextAlign::TOP_CENTER, "Wilgotnosc --%");

        it.print(300, 48, id(font_small_bold), TextAlign::TOP_CENTER, "NA ZEWNATRZ");
        if (id(outdoor_temp).has_state())
          it.printf(300, 76, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.1f C", id(outdoor_temp).state);
        else
          it.print(300, 76, id(font_large_bold), TextAlign::TOP_CENTER, "--.- C");
        if (id(outdoor_humidity).has_state())
          it.printf(300, 116, id(font_small_bold), TextAlign::TOP_CENTER,
                    "Wilgotnosc %.0f%%", id(outdoor_humidity).state);
        else
          it.print(300, 116, id(font_small_bold), TextAlign::TOP_CENTER, "Wilgotnosc --%");

        it.line(10, 155, 390, 155, Color::WHITE);
        it.print(200, 168, id(font_small_bold), TextAlign::TOP_CENTER, "AKTUALNY POBOR MOCY");
        if (id(current_power).has_state())
          it.printf(200, 198, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.0f W", id(current_power).state);
        else
          it.print(200, 198, id(font_large_bold), TextAlign::TOP_CENTER, "-- W");

      } else if (id(current_page) == 1) {
        // STRONA 2: energia — trzy przykładowe sensory mocy.
        it.fill(Color::BLACK);
        it.print(200, 8, id(font_small_bold), TextAlign::TOP_CENTER, "ENERGIA");
        it.line(10, 36, 390, 36, Color::WHITE);
        it.print(200, 48, id(font_small_bold), TextAlign::TOP_CENTER, "AKTUALNY POBOR");
        if (id(current_power).has_state())
          it.printf(200, 72, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.0f W", id(current_power).state);
        else
          it.print(200, 72, id(font_large_bold), TextAlign::TOP_CENTER, "-- W");
        it.line(10, 122, 390, 122, Color::WHITE);
        it.print(100, 138, id(font_small_bold), TextAlign::TOP_CENTER, "CZUWANIE");
        if (id(standby_power).has_state())
          it.printf(100, 166, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.1f W", id(standby_power).state);
        else
          it.print(100, 166, id(font_large_bold), TextAlign::TOP_CENTER, "-- W");
        it.print(300, 138, id(font_small_bold), TextAlign::TOP_CENTER, "BIURO");
        if (id(office_power).has_state())
          it.printf(300, 166, id(font_large_bold), TextAlign::TOP_CENTER,
                    "%.0f W", id(office_power).state);
        else
          it.print(300, 166, id(font_large_bold), TextAlign::TOP_CENTER, "-- W");

      } else if (id(current_page) == 2) {
        // STRONA 3: temperatury w kilku pomieszczeniach.
        it.fill(Color::BLACK);
        it.print(200, 8, id(font_small_bold), TextAlign::TOP_CENTER, "TEMPERATURY");
        it.line(10, 36, 390, 36, Color::WHITE);
        it.print(100, 48, id(font_small_bold), TextAlign::TOP_CENTER, "PARTER");
        if (id(indoor_temp).has_state())
          it.printf(100, 76, id(font_large_bold), TextAlign::TOP_CENTER, "%.1f C", id(indoor_temp).state);
        else
          it.print(100, 76, id(font_large_bold), TextAlign::TOP_CENTER, "--.- C");
        it.print(300, 48, id(font_small_bold), TextAlign::TOP_CENTER, "BIURO");
        if (id(office_temp).has_state())
          it.printf(300, 76, id(font_large_bold), TextAlign::TOP_CENTER, "%.1f C", id(office_temp).state);
        else
          it.print(300, 76, id(font_large_bold), TextAlign::TOP_CENTER, "--.- C");
