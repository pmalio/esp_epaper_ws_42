    id: outdoor_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_outdoor_humidity}
    id: outdoor_humidity

  - platform: homeassistant
    entity_id: ${entity_sensor_actual_power}
    id: current_power

  - platform: homeassistant
    entity_id: ${entity_sensor_power_consumption}
    id: total_power

  - platform: homeassistant
    entity_id: ${entity_sensor_all_standby_power}
    id: standby_power

  - platform: homeassistant
    entity_id: ${entity_sensor_power_desk_office_power}
    id: office_power

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_office_temperature}
    id: office_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_office_humidity}
    id: office_humidity

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_basement_temperature}
    id: basement_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_basement_humidity}
    id: basement_humidity

  - platform: homeassistant
    entity_id: ${entity_sensor_air_quality_pm25}
    id: air_pm25

  - platform: homeassistant
    entity_id: ${entity_sensor_air_quality_voc_index}
    id: air_voc

  - platform: homeassistant
    entity_id: ${entity_sensor_air_quality_temperature}
    id: air_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_air_quality_humidity}
    id: air_humidity

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_1p_temperature}
    id: first_floor_temp

  - platform: homeassistant
    entity_id: ${entity_sensor_temp_1p_humidity}
    id: first_floor_humidity

button:
  - platform: template
    name: "Odśwież e-Paper"
    on_press:
      - logger.log: "Kliknięto odświeżanie e-Paper"
      - component.update: epaperdisplay
      - logger.log: "Polecenie odświeżenia wysłane"

  - platform: template
    name: "Żądaj resetu fabrycznego"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return id(reset_confirmation_pending);'
          then:
            - logger.log:
                level: WARN
                format: "Confirmation already pending; press physical reset button to confirm"
          else:
            - lambda: |-
                id(reset_previous_page) = id(current_page);
                id(reset_confirmation_pending) = true;
                id(current_page) = 6;
            - component.update: epaperdisplay
            - script.execute: reset_confirmation_timeout

binary_sensor:
  - platform: gpio
    name: "Przycisk e-Paper"
    id: epaper_button
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            lambda: 'return id(wifi_connected) && !id(reset_confirmation_pending);'
          then:
            - lambda: |-
                id(current_page) = (id(current_page) + 1) % 6;
            - component.update: epaperdisplay

  - platform: gpio
    name: "Przycisk resetu fabrycznego"
    id: factory_reset_button
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            lambda: 'return id(reset_confirmation_pending);'
          then:
            - script.stop: reset_confirmation_timeout
            - lambda: |-
                id(reset_confirmation_pending) = false;
            - logger.log:
                level: WARN
                format: "Factory reset confirmed by physical button; rebooting to factory firmware"
            - delay: 300ms
            - lambda: |-
                epaper_boot_factory_firmware();
          else:
            - lambda: |-
                id(reset_previous_page) = id(current_page);
                id(reset_confirmation_pending) = true;
                id(current_page) = 6;
            - component.update: epaperdisplay
            - script.execute: reset_confirmation_timeout

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_smoke_sensor_1st_floor_smoke}
    id: smoke_floor1

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_smoke_sensor_attic_smoke}
    id: smoke_attic

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_smoke_sensor_kitchen_smoke}
    id: smoke_kitchen

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_smoke_sensor_living_room_smoke}
    id: smoke_living

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_water_sensor_basement_water_leak}
    id: leak_basement

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_water_sensor_bathroom_water_leak}
    id: leak_bathroom

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_water_sensor_bathroom_small_water_leak}
    id: leak_bathroom_small

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_water_sensor_kitchen_water_leak}
    id: leak_kitchen

  - platform: homeassistant
    entity_id: ${entity_binary_sensor_water_sensor_storage_water_leak}
    id: leak_storage

  - platform: homeassistant
